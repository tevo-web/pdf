<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Free online PDF editor. Edit existing text, add text, whiteout, highlight, draw, sign, insert images and rotate or reorder pages. Files never leave your browser.">
<meta name="theme-color" content="#0077a8">
<meta property="og:title" content="PDF Bench">
<meta property="og:description" content="Edit PDF files right in your browser. Nothing is uploaded.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>PDF Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Caveat:wght@600&family=Dancing+Script:wght@600&family=Great+Vibes&family=Pacifico&display=swap">
<style>
:root{
  --ground:#dfe2e6; --panel:#f7f8f9; --panel-2:#eef0f3; --ink:#1b1f24; --muted:#5d6570; --line:#c9ced5;
  --accent:#0077a8; --accent-ink:#ffffff; --accent-soft:#d6ecf5; --danger:#c23a2b; --shadow:0 1px 2px rgba(20,30,40,.12),0 6px 18px rgba(20,30,40,.10);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#15181c; --panel:#1f2328; --panel-2:#272c32; --ink:#e6e8eb; --muted:#99a2ad; --line:#353b43;
    --accent:#3fb5e6; --accent-ink:#06202b; --accent-soft:#1c3a48; --danger:#ef6a5a; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#15181c; --panel:#1f2328; --panel-2:#272c32; --ink:#e6e8eb; --muted:#99a2ad; --line:#353b43;
  --accent:#3fb5e6; --accent-ink:#06202b; --accent-soft:#1c3a48; --danger:#ef6a5a; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:14px/1.4 var(--sans);overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;min-height:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:600;letter-spacing:.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{width:20px;height:20px;color:var(--accent)}
.fname{font-family:var(--mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 120px}
.grp{display:flex;align-items:center;gap:4px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px;line-height:1.1;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.icon{padding:6px}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.langsel{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:0 4px 0 8px;background:var(--panel)}
.langsel svg{width:15px;height:15px;color:var(--muted);flex:none}
.langsel select{border:0;background:transparent;padding:6px 2px;cursor:pointer}
.zoomv{font-family:var(--mono);font-size:12px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.file-in{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* tool strip */
.tools{display:flex;gap:2px;padding:6px 16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid transparent;background:none;border-radius:6px;padding:5px 9px;min-width:62px;font-size:11.5px;color:var(--muted)}
.tool svg{width:19px;height:19px}
.tool:hover{background:var(--panel-2);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.tool[aria-pressed="true"] svg{color:var(--accent)}
.sep{width:1px;background:var(--line);margin:4px 6px;flex:none}

/* body */
.body{display:grid;grid-template-columns:168px 1fr 232px;min-height:0}
.thumbs{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:14px}
.th{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.th canvas{background:#fff;box-shadow:var(--shadow);border:2px solid transparent;border-radius:2px;cursor:pointer;max-width:100%}
.th.cur canvas{border-color:var(--accent)}
.th .num{font-family:var(--mono);font-size:11px;color:var(--muted)}
.th .ops{display:flex;gap:2px}
.th .ops button{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:3px;display:flex}
.th .ops button:hover{background:var(--panel-2)}
.th .ops svg{width:13px;height:13px}
.th .ops button.del:hover{color:var(--danger)}

.viewer{overflow:auto;position:relative;min-width:0}
.pages{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px 16px 48px;min-width:max-content}
.pagewrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.plabel{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.page{position:relative;background:#fff;box-shadow:var(--shadow)}
.page canvas{position:absolute;inset:0;width:100%;height:100%}
.layer,.tlayer{position:absolute;inset:0}
.layer{touch-action:pan-x pan-y pinch-zoom}
.app[data-tool]:not([data-tool="select"]):not([data-tool="edit"]) .layer{touch-action:none;cursor:crosshair}
.app[data-tool="text"] .layer{cursor:text}
.tlayer{display:none;z-index:5;pointer-events:none}
.app[data-tool="edit"] .tlayer{display:block}
.tspan{position:absolute;pointer-events:auto;border:1px dashed rgba(0,119,168,.55);background:rgba(0,119,168,.06);cursor:text;border-radius:1px}
.tspan:hover{background:rgba(0,119,168,.18);border-style:solid}

.obj{position:absolute;touch-action:none}
.app[data-tool="select"] .obj{cursor:move}
.obj.txt{white-space:pre;line-height:1.2}
.obj svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.obj img{width:100%;height:100%;display:block;max-width:none;user-select:none;-webkit-user-drag:none}
.obj.hl{mix-blend-mode:multiply}
.obj.sel{outline:1.5px solid #00a3e0;outline-offset:2px}
.hdl{position:absolute;right:-8px;bottom:-8px;width:12px;height:12px;background:#fff;border:2px solid #00a3e0;border-radius:2px;cursor:nwse-resize;touch-action:none}
.editor{position:absolute;margin:0;padding:0;border:0;outline:1.5px dashed #00a3e0;outline-offset:2px;background:transparent;resize:none;overflow:hidden;white-space:pre;line-height:1.2;z-index:10}

/* props */
.props{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px 14px 20px;display:flex;flex-direction:column;gap:14px}
.props h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.flabel{font-size:12px;color:var(--muted)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.props select{max-width:100%}
.props select,.props input[type=number]{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 7px;min-width:0}
.props input[type=number]{width:72px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.props input[type=range]{width:100%;accent-color:var(--accent)}
.sw{display:flex;gap:5px;flex-wrap:wrap}
.pal{display:flex;flex-direction:column;gap:6px}
.palbar{display:flex;gap:4px;align-items:stretch}
.palbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:3px 8px;font-size:12px;position:relative;cursor:pointer;flex:1 1 auto;min-width:0}
.palbtn.icon{flex:0 0 auto;padding:3px 6px}
.palbtn svg{width:15px;height:15px}
.palbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.palbtn input[type=color]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.palbtn .auto{width:14px;height:14px;background:#000;border:1px solid var(--line)}
.palbtn .nofill{width:14px;height:14px;border:1px solid var(--line);background:linear-gradient(135deg,transparent 44%,#c00000 44%,#c00000 56%,transparent 56%),#fff}
.palbtn .rainbow{width:15px;height:15px;border-radius:50%;background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.palhead{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--muted);margin-top:2px}
.palsel{font-size:11px;padding:1px 2px!important;border-radius:4px!important;max-width:120px}
.palgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;max-width:204px}
.swc{aspect-ratio:1;width:100%;border:1px solid rgba(0,0,0,.14);padding:0;border-radius:1px;cursor:pointer}
.swc.base{margin-bottom:3px}
.swc:hover{outline:1px solid #e3a21a;outline-offset:1px;z-index:1}
.swc[aria-pressed="true"]{outline:2px solid #e3a21a;outline-offset:1px;z-index:1}
.hint.small{font-size:11.5px;margin-top:-6px}
.symgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;max-width:204px}
.symb{aspect-ratio:1;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:5px;display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;min-width:0}
.symb svg{width:100%;height:100%}
.symb.txt{font:15px/1 'PB Serif','Times New Roman',serif;padding:0}
.symb:hover{background:var(--panel-2)}
.symb[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sigs{display:flex;flex-direction:column;gap:6px}
.sigitem{display:flex;gap:4px;align-items:stretch}
.sigbtn{flex:1;min-width:0;height:54px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px 8px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sigbtn img{max-height:100%;max-width:100%;object-fit:contain}
.sigbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sigdel{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:26px;cursor:pointer;color:var(--muted)}
.sigdel:hover{color:var(--danger)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(12,18,24,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--panel);color:var(--ink);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.mhead{display:flex;align-items:center;justify-content:space-between}
.mhead h3{margin:0;font-size:16px;font-weight:600}
.mtabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.mtabs button{border:0;background:none;padding:8px 14px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);cursor:pointer;font-weight:500}
.mtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.mpane{display:flex;flex-direction:column;gap:10px}
.padwrap{position:relative;height:190px;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
#sigPad{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.padline{position:absolute;left:24px;right:24px;bottom:46px;border-bottom:1px dashed #b9c0c9;pointer-events:none}
.padhint{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:12px;color:#8a929c;pointer-events:none}
.mrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pens{display:flex;gap:6px}
.pen{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.pen[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.tin{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 10px;font-size:15px}
.fontopts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fontopt{border:1px solid var(--line);background:#fff;border-radius:8px;height:64px;font-size:28px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 10px;cursor:pointer}
.fontopt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.uprev{min-height:120px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#f1f2f4 0 25%,#fff 0 50%) 0 0/16px 16px;padding:10px}
.uprev canvas{max-width:100%;max-height:170px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--accent)}
.merr{margin:0;color:var(--danger);font-size:13px;min-height:0}
.merr:empty{display:none}
.mfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.fmtgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fmt{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px;cursor:pointer;min-width:0}
.fmt:hover{background:var(--panel-2)}
.fmt[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.fmt .badge{grid-row:1/3;width:34px;height:34px;border-radius:6px;color:#fff;font:700 12px/34px var(--sans);text-align:center;letter-spacing:.02em}
.fmt .fmtname{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmt .fmtext{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tin.small{padding:4px 8px;font-size:13px;width:140px;font-family:var(--mono)}
#convOpts select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;max-width:100%}
.prog{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.prog .bar{height:100%;width:0;background:var(--accent);transition:width .2s}
@media (max-width:520px){.fmtgrid{grid-template-columns:repeat(2,1fr)}}
.app.picking .layer,.app.picking .tspan,.app.picking .obj{cursor:crosshair!important}
.sw button{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);padding:0}
.sw button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.sw input[type=color]{width:24px;height:24px;border:1px solid var(--line);border-radius:50%;padding:0;background:none;cursor:pointer}
.tog{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;min-width:34px}
.tog[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0}
.hint kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel-2)}
.dangerbtn{color:var(--danger)}

.status{display:flex;gap:18px;align-items:center;padding:5px 16px;background:var(--panel);border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.status .msg{margin-left:auto;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-family:var(--sans)}

.banner{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:7px 16px;background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:13px}
.banner[hidden]{display:none!important}
.drop{position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:10px;background:color-mix(in srgb,var(--accent-soft) 70%,transparent);display:flex;align-items:center;justify-content:center;font-weight:600;z-index:20;pointer-events:none}
.busy{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,15,20,.35);z-index:50}
.busy div{background:var(--panel);padding:14px 20px;border-radius:8px;box-shadow:var(--shadow)}

@media (max-width:900px){
  .body{grid-template-columns:1fr}
  .thumbs{display:none}
  .props{position:fixed;left:0;right:0;bottom:0;max-height:42vh;border-left:0;border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.15);z-index:30;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .props.idle{display:none}
  .status .xy{display:none}
  .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app" id="app" data-tool="select">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2.8h8.2L19 7.6V21H6z"/><path d="M14 2.8V8h5"/><path d="M9 15.5l5.2-5.2 1.9 1.9-5.2 5.2H9z"/></svg>PDF Bench</div>
    <div class="grp">
      <label class="btn" for="fileIn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h6l2 2h10v10H3z"/></svg><span class="lbl" data-i18n="open">Open PDF</span></label>
      <input id="fileIn" class="file-in" type="file" accept="application/pdf,.pdf">
    </div>
    <div class="fname" id="fname">—</div>
    <div class="grp">
      <button class="btn icon" id="undoBtn" data-i18n-title="undoT" data-i18n-aria="undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 010 12"/></svg></button>
      <button class="btn icon" id="redoBtn" data-i18n-title="redoT" data-i18n-aria="redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 7l5 5-5 5"/><path d="M20 12H10a6 6 0 000 12"/></svg></button>
    </div>
    <div class="grp">
      <button class="btn icon" id="zoutBtn" data-i18n-aria="zoomOut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14"/></svg></button>
      <button class="btn zoomv" id="zoomVal" data-i18n-title="fitWidth">100%</button>
      <button class="btn icon" id="zinBtn" data-i18n-aria="zoomIn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M12 5v14"/></svg></button>
    </div>
    <label class="langsel" for="langSel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 3.8 5.8 3.8 9s-1.2 6.2-3.8 9c-2.6-2.8-3.8-5.8-3.8-9S9.4 5.8 12 3z"/></svg><select id="langSel" data-i18n-aria="language"><option value="en">English</option><option value="vi">Tiếng Việt</option></select></label>
    <button class="btn" id="convBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5"/></svg><span class="lbl" data-i18n="convert">Convert</span></button>
    <button class="btn primary" id="saveBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m-5-5l5 5 5-5"/><path d="M4 19h16"/></svg><span data-i18n="save">Save PDF</span></button>
  </header>

  <nav class="tools" id="tools" data-i18n-aria="tools"></nav>

  <div class="body">
    <aside class="thumbs" id="thumbs" aria-label="Trang"></aside>
    <section class="viewer" id="viewer">
      <div class="banner" id="banner"><span data-i18n="bannerMsg"></span><label class="btn" for="fileIn" data-i18n="choosePdf"></label></div>
      <div class="pages" id="pages"></div>
    </section>
    <aside class="props idle" id="props"></aside>
  </div>

  <footer class="status">
    <span id="stPages">—</span>
    <span id="stSize">—</span>
    <span class="xy" id="stXY">x — · y — pt</span>
    <span class="msg" id="stMsg"></span>

</div>

  for(const p of pages){const e=pageEls[p.id];if(!e)continue;const r=e.page.getBoundingClientRect();const d=r.top<=mid&&r.bottom>=mid?0:Math.min(Math.abs(r.top-mid),Math.abs(r.bottom-mid));if(d<bd){bd=d;best=p;}}
  return best;
}
function markCurThumb(){const c=curPage();thumbsEl.querySelectorAll('.th').forEach(t=>t.classList.toggle('cur',!!c&&t.dataset.pid===c.id));}
function scrollToPage(pid){const e=pageEls[pid];if(e)viewer.scrollTo({top:e.wrap.offsetTop-12,behavior:'smooth'});}
let scT;viewer.addEventListener('scroll',()=>{clearTimeout(scT);scT=setTimeout(()=>{markCurThumb();updStatus();for(const p of pages){const e=pageEls[p.id];if(e&&visible(e.page))renderPage(p.id);}},80);},{passive:true});

/* ---------- page operations ---------- */
function rotateObjs(p,dir,oldW,oldH){
  for(const o of p.objs){
    const b=boxOf(o);const cx=b.x+b.w/2,cy=b.y+b.h/2;
    const ncx=dir>0?oldH-cy:cy, ncy=dir>0?cx:oldW-cx;
    if(o.type==='text'||o.type==='image'||o.type==='mark'){o.x=ncx-b.w/2;o.y=ncy-b.h/2;}
    else{o.w=b.h;o.h=b.w;o.x=ncx-o.w/2;o.y=ncy-o.h/2;
      if(o.pts)o.pts=o.pts.map(([x,y])=>dir>0?[1-y,x]:[y,1-x]);}
  }
}
function pageOp(pid,op){
  const i=pages.findIndex(p=>p.id===pid);if(i<0)return;const prev=snap();const p=pages[i];
  if(op==='rotL'||op==='rotR'){const d=op==='rotR'?1:-1;const[w,h]=dims(p);p.rot=(p.rot+90*d+360)%360;rotateObjs(p,d,w,h);}
  else if(op==='up'&&i>0){pages.splice(i-1,0,pages.splice(i,1)[0]);}
  else if(op==='down'&&i<pages.length-1){pages.splice(i+1,0,pages.splice(i,1)[0]);}
  else if(op==='blank'){const[w,h]=dims(p);pages.splice(i+1,0,{id:nid(),src:null,base:0,rot:0,view:[0,0,w,h],objs:[]});}
  else if(op==='del'){if(pages.length===1){say(tr('needOne'));return;}pages.splice(i,1);if(sel&&sel.pid===pid)sel=null;}
  record(prev);buildPages();renderProps();
  if(op==='del')say(tr('deletedPage',i+1));
}

/* ---------- object rendering ---------- */
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function objHTML(o,p){
  const z=zoom,b=boxOf(o);const isSel=sel&&sel.oid===o.id;
  const st=`left:${b.x*z}px;top:${b.y*z}px;width:${b.w*z}px;height:${b.h*z}px;`;
  const h=isSel?'<div class="hdl" data-h="1"></div>':'';
  const cls='obj'+(isSel?' sel':'');
  if(o.type==='text'){
    if(editing&&editing.oid===o.id)return'';
    return`<div class="${cls} txt" data-id="${o.id}" style="left:${o.x*z}px;top:${o.y*z}px;font:${esc(cssFont(o,o.size*z))};line-height:1.2;color:${o.color};opacity:${o.opacity??1}">${esc(o.text)}${h}</div>`;
  }
  if(o.type==='whiteout')return`<div class="${cls}" data-id="${o.id}" style="${st}background:${o.color}">${h}</div>`;
  if(o.type==='highlight')return`<div class="${cls} hl" data-id="${o.id}" style="${st}background:${o.color};opacity:${o.opacity}">${h}</div>`;
  if(o.type==='image')return`<div class="${cls}" data-id="${o.id}" style="${st}opacity:${o.opacity??1}"><img src="${images[o.img]?images[o.img].url:''}" alt="">${h}</div>`;
  if(o.type==='mark')return`<div class="${cls}" data-id="${o.id}" style="${st}opacity:${o.opacity??1}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${markSVG(o.kind,o.color)}</svg>${h}</div>`;
  const sw=o.sw*z;
  if(o.type==='rect'||o.type==='ellipse'){
    const W=b.w*z,H=b.h*z;
    const shape=o.type==='rect'?`<rect x="${sw/2}" y="${sw/2}" width="${Math.max(0,W-sw)}" height="${Math.max(0,H-sw)}"/>`:`<ellipse cx="${W/2}" cy="${H/2}" rx="${Math.max(0,W/2-sw/2)}" ry="${Math.max(0,H/2-sw/2)}"/>`;
    return`<div class="${cls}" data-id="${o.id}" style="${st}opacity:${o.opacity}"><svg viewBox="0 0 ${W} ${H}" fill="${o.fill||'none'}" stroke="${o.stroke||'none'}" stroke-width="${sw}">${shape}</svg>${h}</div>`;
  }
  if(o.type==='draw'){
    const W=b.w*z,H=b.h*z;const d=o.pts.map(([x,y],k)=>(k?'L':'M')+(x*W).toFixed(1)+' '+(y*H).toFixed(1)).join('');
    return`<div class="${cls}" data-id="${o.id}" style="${st}opacity:${o.opacity}"><svg viewBox="0 0 ${Math.max(W,.01)} ${Math.max(H,.01)}" fill="none" stroke="${o.stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>${h}</div>`;
  }
  return'';
}
function drawObjs(p){const e=pageEls[p.id];if(!e)return;const ed=e.layer.querySelector('.editor');e.layer.innerHTML=p.objs.map(o=>objHTML(o,p)).join('');if(ed)e.layer.appendChild(ed);}
const findObj=(pid,oid)=>{const p=pById(pid);return p?p.objs.find(o=>o.id===oid):null;};

/* ---------- text editor ---------- */
let editing=null; // {pid,oid,prev,ta}
function startEdit(pid,oid,prev,selectAll){
  finishEdit();
  const p=pById(pid),o=findObj(pid,oid);if(!o)return;
  editing={pid,oid,prev:prev??snap()};sel={pid,oid};
  drawObjs(p);
  const ta=document.createElement('textarea');ta.className='editor';ta.spellcheck=false;ta.value=o.text;ta.id='ed-'+oid;
  editing.ta=ta;pageEls[pid].layer.appendChild(ta);sizeEditor();
  ta.addEventListener('input',()=>{o.text=ta.value;sizeEditor();});
  ta.addEventListener('blur',()=>setTimeout(()=>{if(editing&&editing.ta===ta&&document.activeElement!==ta)finishEdit();},0));
  ta.addEventListener('keydown',ev=>{if(ev.key==='Escape'){ev.preventDefault();ta.blur();}ev.stopPropagation();});
  ta.addEventListener('pointerdown',ev=>ev.stopPropagation());
  ta.focus({preventScroll:true});if(selectAll)ta.select();else ta.setSelectionRange(ta.value.length,ta.value.length);
  renderProps();
}
function sizeEditor(){
  if(!editing)return;const o=findObj(editing.pid,editing.oid);if(!o)return;const ta=editing.ta,z=zoom;const m=measure(o);
  Object.assign(ta.style,{left:o.x*z+'px',top:o.y*z+'px',width:(m.w+o.size*.6)*z+'px',height:m.h*z+'px',font:cssFont(o,o.size*z),lineHeight:'1.2',color:o.color});
}
function finishEdit(){
  if(!editing)return;const{pid,oid,prev,ta}=editing;editing=null;
  const p=pById(pid);if(ta)ta.remove();
  if(p){const o=p.objs.find(x=>x.id===oid);if(o&&!o.text.trim()){p.objs=p.objs.filter(x=>x!==o);if(sel&&sel.oid===oid)sel=null;}drawObjs(p);}
  record(prev);renderProps();
}

/* ---------- pointer interactions ---------- */
let lastTap={t:0,id:null};
let pickFor=null;
function doPick(p,layer,ev){
  ev.preventDefault();ev.stopPropagation();
  const[x,y]=ptIn(layer,ev);const c=pixelAt(p,x,y);const k=pickFor;
  pickFor=null;app.classList.remove('picking');
  if(c){applyProp(o=>o[k]=c);say(tr('picked',c.toUpperCase()));}else{renderProps();say(tr('ready'));}
}
function ptIn(layer,ev){const r=layer.getBoundingClientRect();return[(ev.clientX-r.left)/zoom,(ev.clientY-r.top)/zoom];}
function bindLayer(layer,pid){
  layer.addEventListener('pointermove',ev=>{const[x,y]=ptIn(layer,ev);const p=pById(pid);if(!p)return;const[a,b]=toPdf(p,x,y);$('#stXY').textContent=`x ${a.toFixed(0)} · y ${b.toFixed(0)} pt`;});
  layer.addEventListener('pointerdown',ev=>{
    if(ev.button>0)return;
    const p=pById(pid);if(!p)return;
    if(pickFor){doPick(p,layer,ev);return;}
    const objEl=ev.target.closest('.obj');const isH=!!ev.target.closest('.hdl');
    const[x0,y0]=ptIn(layer,ev);
    if(editing){finishEdit();if(tool==='text'&&!objEl)return;}
    // text tool on existing text: edit
    if(tool==='text'&&objEl){const o=findObj(pid,objEl.dataset.id);if(o&&o.type==='text'){ev.preventDefault();startEdit(pid,o.id,null,false);return;}}
    if(tool==='check'&&objEl&&!isH){const o=findObj(pid,objEl.dataset.id);
      if(o&&o.type==='mark'){ev.preventDefault();const cyc=[['check','cross','dot'],['boxcheck','boxcross','box','boxfill'],['radio','circle']].find(c=>c.includes(o.kind));
        if(cyc){const prev=snap();o.kind=cyc[(cyc.indexOf(o.kind)+1)%cyc.length];drawObjs(p);record(prev);}return;}}
    if(tool==='select'||tool==='edit'||isH){
      if(!objEl){if(sel){sel=null;pages.forEach(drawObjs);renderProps();}return;}
      ev.preventDefault();
      const o=findObj(pid,objEl.dataset.id);if(!o)return;
      const now=performance.now();if(!isH&&o.type==='text'&&lastTap.id===o.id&&now-lastTap.t<400){lastTap={t:0,id:null};startEdit(pid,o.id,null,false);return;}lastTap={t:now,id:o.id};
      const prevSel=sel;sel={pid,oid:o.id};if(!prevSel||prevSel.oid!==o.id){if(prevSel&&prevSel.pid!==pid){const pp=pById(prevSel.pid);if(pp)drawObjs(pp);}drawObjs(p);renderProps();}
      const prev=snap();const b0=boxOf(o);const s0={x:o.x,y:o.y,w:o.w,h:o.h,size:o.size};
      layer.setPointerCapture(ev.pointerId);
      const mv=e2=>{
        const[x,y]=ptIn(layer,e2);const dx=x-x0,dy=y-y0;
        if(isH){
          if(o.type==='text'){const nw=Math.max(8,b0.w+dx);o.size=Math.max(4,Math.round(s0.size*nw/b0.w*2)/2);}
          else if(o.type==='image'||o.type==='mark'){const k=Math.max(4/b0.w,(b0.w+dx)/b0.w);o.w=b0.w*k;o.h=b0.h*k;}
          else{o.w=Math.max(4,s0.w+dx);o.h=Math.max(4,s0.h+dy);}
        }else{o.x=s0.x+dx;o.y=s0.y+dy;}
        drawObjs(p);
      };
      const up=()=>{layer.removeEventListener('pointermove',mv);layer.removeEventListener('pointerup',up);layer.removeEventListener('pointercancel',up);record(prev);renderProps();};
      layer.addEventListener('pointermove',mv);layer.addEventListener('pointerup',up);layer.addEventListener('pointercancel',up);
      return;
    }
    ev.preventDefault();
    if(tool==='text'){
      const prev=snap();const d=defaults.text;
      const o={id:nid(),type:'text',x:x0,y:0,text:'',size:d.size,font:d.font,bold:d.bold,italic:d.italic,color:d.color};
      o.y=y0-measure(o).base+o.size*.35;p.objs.push(o);startEdit(pid,o.id,prev,false);return;
    }
    if(tool==='image'){pendingImagePos={pid,x:x0,y:y0};$('#imgIn').click();return;}
    if(tool==='check'||(tool==='symbol'&&defaults.symbol.sym.startsWith('m:'))){
      const d=tool==='check'?defaults.check:defaults.symbol;const kind=tool==='check'?d.kind:d.sym.slice(2);const w=d.size*.85;
      const prev=snap();p.objs.push({id:nid(),type:'mark',kind,x:x0-w/2,y:y0-w/2,w,h:w,color:d.color,opacity:d.opacity??1});drawObjs(p);record(prev);return;
    }
    if(tool==='symbol'){
      const d=defaults.symbol,dt=defaults.text;const prev=snap();
      const o={id:nid(),type:'text',x:0,y:0,text:d.sym,size:d.size,font:dt.font,bold:false,italic:false,color:d.color};
      const m=measure(o);o.x=x0-m.w/2;o.y=y0-m.h/2;p.objs.push(o);drawObjs(p);record(prev);return;
    }
    if(tool==='sign'){
      const sg=sigs.find(x=>x.id===armedSig);
      if(sg)placeSig(sg,p,x0,y0);else{pendingSigPos={pid,x:x0,y:y0};openSig();}
      return;
    }
    if(['whiteout','highlight','rect','ellipse'].includes(tool)){
      const prev=snap();const d=defaults[tool];
      const o=Object.assign({id:nid(),type:tool,x:x0,y:y0,w:0,h:0},JSON.parse(JSON.stringify(d)));
      p.objs.push(o);sel={pid,oid:o.id};layer.setPointerCapture(ev.pointerId);
      const mv=e2=>{const[x,y]=ptIn(layer,e2);o.x=Math.min(x,x0);o.y=Math.min(y,y0);o.w=Math.abs(x-x0);o.h=Math.abs(y-y0);if(e2.shiftKey&&tool!=='highlight'){const m=Math.max(o.w,o.h);o.w=o.h=m;o.x=x<x0?x0-m:x0;o.y=y<y0?y0-m:y0;}drawObjs(p);};
      const up=()=>{layer.removeEventListener('pointermove',mv);layer.removeEventListener('pointerup',up);layer.removeEventListener('pointercancel',up);
        if(o.w<3||o.h<3){if(tool==='highlight'||tool==='whiteout'){o.w=Math.max(o.w,120);o.h=Math.max(o.h,tool==='highlight'?14:18);}else{o.w=Math.max(o.w,100);o.h=Math.max(o.h,70);}}
        drawObjs(p);record(prev);renderProps();};
      layer.addEventListener('pointermove',mv);layer.addEventListener('pointerup',up);layer.addEventListener('pointercancel',up);
      drawObjs(p);return;
    }
    if(tool==='draw'){
      const prev=snap();const d=defaults.draw;const pts=[[x0,y0]];
      const o={id:nid(),type:'draw',x:x0,y:y0,w:.01,h:.01,pts:[[0,0]],stroke:d.stroke,sw:d.sw,opacity:d.opacity};
      p.objs.push(o);layer.setPointerCapture(ev.pointerId);
      const norm=()=>{let a=1e9,b=1e9,c=-1e9,e=-1e9;for(const[x,y]of pts){a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);e=Math.max(e,y);}o.x=a;o.y=b;o.w=Math.max(c-a,.01);o.h=Math.max(e-b,.01);o.pts=pts.map(([x,y])=>[(x-a)/o.w,(y-b)/o.h]);};
      const mv=e2=>{const evs=e2.getCoalescedEvents?e2.getCoalescedEvents():[e2];for(const ce of evs){const q=ptIn(layer,ce);const l=pts[pts.length-1];if(Math.hypot(q[0]-l[0],q[1]-l[1])>.8)pts.push(q);}norm();drawObjs(p);};
      const up=()=>{layer.removeEventListener('pointermove',mv);layer.removeEventListener('pointerup',up);layer.removeEventListener('pointercancel',up);
        if(pts.length<2)pts.push([x0+.5,y0+.5]);norm();sel={pid,oid:o.id};drawObjs(p);record(prev);renderProps();};
      layer.addEventListener('pointermove',mv);layer.addEventListener('pointerup',up);layer.addEventListener('pointercancel',up);
    }
  });
}

/* ---------- edit existing text ---------- */
async function getTextItems(p){
  if(p.src==null)return[];
  const key=p.id+'|'+rotOf(p);if(textCache[key])return textCache[key];
  const pg=pdfPageCache[p.src];
  if(!opListDone[p.src]){try{await pg.getOperatorList();}catch(_){}opListDone[p.src]=1;} /* makes every font object available */
  const tc=await pg.getTextContent();
  const vp=pg.getViewport({scale:1,rotation:rotOf(p)});
  const out=[];
  for(const it of tc.items){
    if(!it.str||!it.str.trim())continue;
    const t=pdfjs.Util.transform(vp.transform,it.transform);
    if(Math.abs(t[1])>.01*Math.abs(t[0])||t[0]<=0)continue;
    const fh=Math.hypot(t[2],t[3]);if(fh<1)continue;
    const st=tc.styles[it.fontName]||{};const asc=st.ascent||.8,desc=st.descent||-.2;
    let fam='helv',bold=false,italic=false,fname='';
    try{const f=pg.commonObjs.get(it.fontName);fname=(f&&(f.name||f.loadedName))||'';if(f&&f.bold)bold=true;if(f&&f.italic)italic=true;}catch(_){}
    const nm=fname.toLowerCase().replace(/^[a-z]{6}\+/,'').replace(/[,_-]/g,' ');const gen=(st.fontFamily||'').toLowerCase();
    let named=true;
    if(/calibri|carlito|aptos|corbel|candara/.test(nm))fam='calibri';
    else if(/courier|cousine|consolas|menlo|lucida ?console|mono/.test(nm))fam='cour';
    else if(/times|tinos|cambria|caladea|georgia|garamond|minion|palatino|baskerville|book ?antiqua|liberation ?serif|noto ?serif|dejavu ?serif|\bserif|roman/.test(nm)&&!/sans/.test(nm))fam='times';
    else if(/arial|helvetica|arimo|verdana|tahoma|segoe|roboto|open ?sans|inter|lato|noto ?sans|liberation ?sans|dejavu ?sans|sans/.test(nm))fam='helv';
    else{named=false;fam=gen==='serif'?'times':gen==='monospace'?'cour':'helv';}
    if(/bold|black|heavy|semibold|demi/.test(nm))bold=true;
    if(/italic|oblique/.test(nm))italic=true;
    if(!named&&it.str.trim().length>=4){ /* unknown name: pick the family whose letter widths match the original run */
      const cands=gen==='serif'?['times']:gen==='monospace'?['cour']:['times','helv','calibri'];let bd=1e9;
      for(const c of cands){const w=measure({text:it.str,size:fh,font:c,bold,italic}).w;const d=Math.abs(w-it.width);if(d<bd){bd=d;fam=c;}}
    }
    out.push({str:it.str,x:t[4],base:t[5],fh,w:it.width,top:t[5]-fh*asc,h:fh*(asc-desc),fam,bold,italic,src:fname});
  }
  textCache[key]=out;return out;
}
async function buildTextSpans(p){
  const e=pageEls[p.id];if(!e)return;e.tlayer.innerHTML='';
  if(p.src==null)return;
  const items=await getTextItems(p);if(tool!=='edit')return;
  const z=zoom;const used=new Set(p.objs.filter(o=>o.fromText).map(o=>o.fromText));
  e.tlayer.innerHTML=items.map((it,k)=>used.has(k)?'':`<div class="tspan" data-k="${k}" title="${esc(it.str)}" style="left:${it.x*z}px;top:${it.top*z}px;width:${Math.max(it.w,2)*z}px;height:${it.h*z}px"></div>`).join('');
  e.tlayer.onpointerdown=async ev=>{
    if(pickFor){doPick(p,e.layer,ev);return;}
    const sp=ev.target.closest('.tspan');
    if(!sp){return;}
    ev.preventDefault();ev.stopPropagation();
    if(editing)finishEdit();
    const k=+sp.dataset.k;const it=items[k];const prev=snap();
    const col=sampleColors(p,it);
    const pad=Math.max(1,it.fh*.08);
    p.objs.push({id:nid(),type:'whiteout',x:it.x-pad,y:it.top-pad,w:it.w+pad*2,h:it.h+pad*2,color:col.bg,fromText:k});
    const o={id:nid(),type:'text',x:it.x,y:0,text:it.str,size:Math.round(it.fh*10)/10,font:it.fam,bold:it.bold,italic:it.italic,color:col.ink,fromText:k};
    o.y=it.base-measure(o).base;p.objs.push(o);
    sp.remove();
    startEdit(p.id,o.id,prev,true);
  };
}
function canvasBox(p,x,y,w,h){
  const cv=pageEls[p.id].canvas;const ctx=cv.getContext('2d',{willReadFrequently:true});const k=cv.width/(dims(p)[0]);
  const X=Math.max(0,Math.floor(x*k)),Y=Math.max(0,Math.floor(y*k));const W=Math.min(cv.width-X,Math.ceil(w*k)),H=Math.min(cv.height-Y,Math.ceil(h*k));
  if(W<1||H<1)return null;return ctx.getImageData(X,Y,W,H).data;
}
/* background = most common colour around the run; ink = the colour furthest from it */
function sampleColors(p,it){
  const res={bg:'#ffffff',ink:'#000000'};
  try{
    const pad=Math.max(2,it.fh*.25);
    const d=canvasBox(p,it.x-pad,it.top-pad,it.w+pad*2,it.h+pad*2);if(!d)return res;
    const hist=new Map();
    for(let i=0;i<d.length;i+=4){const q=((d[i]>>3)<<10)|((d[i+1]>>3)<<5)|(d[i+2]>>3);const e=hist.get(q);if(e){e[0]++;e[1]+=d[i];e[2]+=d[i+1];e[3]+=d[i+2];}else hist.set(q,[1,d[i],d[i+1],d[i+2]]);}
    let top=null;for(const e of hist.values())if(!top||e[0]>top[0])top=e;
    const bg=[top[1]/top[0],top[2]/top[0],top[3]/top[0]];
    res.bg=bg.every(v=>v>246)?'#ffffff':rgb2hex(bg);
    const t=canvasBox(p,it.x,it.top,it.w,it.h)||d;let far=0,ink=null;
    for(let i=0;i<t.length;i+=4){const c=[t[i],t[i+1],t[i+2]];const dd=cdist(c,bg);if(dd>far){far=dd;ink=c;}}
    if(ink&&far>60){const h=rgb2hex(ink);res.ink=snapOffice(h,34);if(res.ink===h&&Math.max(...ink)<60)res.ink='#000000';}
  }catch(_){}
  return res;
}
function pixelAt(p,x,y){try{const d=canvasBox(p,x,y,.01,.01);return d?rgb2hex([d[0],d[1],d[2]]):null;}catch(_){return null;}}

/* ---------- images ---------- */
let pendingImagePos=null;
$('#imgIn').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)addImageFile(f);});
async function addImageFile(f){
  try{
    const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});

/* Excel model. A row is tabular when it holds several phrases far apart. Within tabular rows, text is split

    h+=`<div class="row">${o.type==='text'?`<button class="btn" id="pEdit">${tr('editText')}</button>`:''}<button class="btn" id="pDup">${tr('dup')}</button><button class="btn" id="pFront">${tr('front')}</button><button class="btn dangerbtn" id="pDel">${ico('del')}${tr('del')}</button></div>`;
    h+=`<p class="hint">${tr('keysSel')}</p>`;
  }else if(tool==='select'){
    h+=`<p class="hint">${tr('keysIdle')}</p>`;
    const p=curPage();if(p)h+=`<div class="row"><button class="btn" data-pop="rotL">${ico('rotL')}${tr('rotPage')}</button><button class="btn" data-pop="blank">${ico('plus')}${tr('blankPage')}</button><button class="btn dangerbtn" data-pop="del">${ico('del')}${tr('delPage')}</button></div>`;
  }
  propsEl.innerHTML=h;
  propsEl.classList.toggle('idle',!o&&tool==='select');
}
function applyProp(fn){
  const o=sel?findObj(sel.pid,sel.oid):null;const t=o?o.type:tool;
  const d=defaults[t];
  const prev=snap();
  if(d)fn(d);
  if(o){fn(o);const p=pById(sel.pid);drawObjs(p);if(editing&&editing.oid===o.id)sizeEditor();}
  record(prev);renderProps();
  if(editing&&editing.ta)editing.ta.focus({preventScroll:true});
}
propsEl.addEventListener('pointerdown',e=>{if(editing&&e.target.closest('button'))e.preventDefault();});
propsEl.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.pick){pickFor=pickFor===b.dataset.pick?null:b.dataset.pick;app.classList.toggle('picking',!!pickFor);if(pickFor)say(tr('pickHint'),true);else say(tr('ready'));renderProps();return;}
  if(b.dataset.mk)return applyProp(o=>o.kind=b.dataset.mk);
  if(b.dataset.sym){defaults.symbol.sym=b.dataset.sym;renderProps();return;}
  if(b.dataset.sig){armedSig=b.dataset.sig;renderProps();say(tr('h_sign'));return;}
  if(b.dataset.sigdel){sigs=sigs.filter(g=>g.id!==b.dataset.sigdel);if(armedSig===b.dataset.sigdel)armedSig=sigs.length?sigs[sigs.length-1].id:null;saveSigs();renderProps();return;}
  if(b.id==='pNewSig'){pendingSigPos=null;openSig();return;}
  if(b.dataset.color)return applyProp(o=>o.color=b.dataset.color);
  if(b.dataset.stroke)return applyProp(o=>o.stroke=b.dataset.stroke==='none'?null:b.dataset.stroke);
  if(b.dataset.fill)return applyProp(o=>o.fill=b.dataset.fill==='none'?null:b.dataset.fill);
  if(b.dataset.pop){const p=curPage();if(p)pageOp(p.id,b.dataset.pop);return;}
  if(b.id==='pBold')return applyProp(o=>o.bold=!o.bold);
  if(b.id==='pItalic')return applyProp(o=>o.italic=!o.italic);
  if(b.id==='pDel')return deleteSel();
  if(b.id==='pEdit')return startEdit(sel.pid,sel.oid,null,false);
  if(b.id==='pDup'){const p=pById(sel.pid),o=findObj(sel.pid,sel.oid);const prev=snap();const c=JSON.parse(JSON.stringify(o));c.id=nid();delete c.fromText;c.x+=10;c.y+=10;p.objs.push(c);sel={pid:p.id,oid:c.id};drawObjs(p);record(prev);renderProps();return;}
  if(b.id==='pFront'){const p=pById(sel.pid),o=findObj(sel.pid,sel.oid);const prev=snap();p.objs=p.objs.filter(x=>x!==o);p.objs.push(o);drawObjs(p);record(prev);return;}
});
propsEl.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='pFont')applyProp(o=>o.font=t.value);
  else if(t.id==='pSize'){const v=parseFloat(t.value);if(v>0)applyProp(o=>o.size=Math.min(400,v));}
  else if(t.id==='pMk'){const v=parseFloat(t.value);if(v>0)applyProp(o=>{if(o.type==='mark'){const cx=o.x+o.w/2,cy=o.y+o.h/2;o.w=o.h=Math.min(400,v)*.85;o.x=cx-o.w/2;o.y=cy-o.h/2;}else o.size=Math.min(400,v);});}
  else if(t.id==='pSw'){const v=parseFloat(t.value);if(v>0)applyProp(o=>o.sw=v);}
  else if(t.id==='pOp'){const v=parseFloat(t.value);applyProp(o=>o.opacity=v);}
  else if(t.dataset.cc){const k=t.dataset.cc;applyProp(o=>o[k]=t.value.toLowerCase());}
  else if(t.dataset.paltheme){palTheme=t.value;try{localStorage.setItem('pdfbench.pal',palTheme);}catch(_){}renderProps();}
});
propsEl.addEventListener('input',e=>{const t=e.target;if(t.id==='pOp'){const o=sel?findObj(sel.pid,sel.oid):null;if(o){o.opacity=parseFloat(t.value);drawObjs(pById(sel.pid));}const l=propsEl.querySelector('label[for=pOp]');if(l)l.textContent=tr('opacity',Math.round(t.value*100));}});
function deleteSel(){if(!sel)return;const p=pById(sel.pid);const prev=snap();p.objs=p.objs.filter(o=>o.id!==sel.oid);sel=null;drawObjs(p);if(tool==='edit')buildTextSpans(p);record(prev);renderProps();}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  const inField=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&!inField&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&!inField&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();savePdf();return;}
  if(inField)return;
  if(sel&&(e.key==='Delete'||e.key==='Backspace')){e.preventDefault();deleteSel();return;}
  if(sel&&/^Arrow/.test(e.key)){e.preventDefault();const o=findObj(sel.pid,sel.oid);if(!o)return;const s=e.shiftKey?10:1;const prev=snap();if(e.key==='ArrowLeft')o.x-=s;if(e.key==='ArrowRight')o.x+=s;if(e.key==='ArrowUp')o.y-=s;if(e.key==='ArrowDown')o.y+=s;drawObjs(pById(sel.pid));record(prev);renderProps();return;}
  if(!$('#sigModal').hidden){if(e.key==='Escape'){e.preventDefault();closeSig();}return;}
  if(!$('#convModal').hidden){if(e.key==='Escape'){e.preventDefault();closeConvert();}return;}
  if(e.key==='Escape'&&pickFor){pickFor=null;app.classList.remove('picking');renderProps();say(tr('ready'));return;}
  if(e.key==='Escape'){if(sel){sel=null;pages.forEach(drawObjs);renderProps();}else setTool('select');}
  const map={v:'select',e:'edit',t:'text',w:'whiteout',h:'highlight',r:'rect',o:'ellipse',d:'draw'};
  if(!mod&&map[e.key.toLowerCase()])setTool(map[e.key.toLowerCase()]);
});

/* ---------- zoom ---------- */
function setZoom(z){
  const v=viewer,ratio=(v.scrollTop+v.clientHeight/2)/Math.max(1,v.scrollHeight);
  fitMode=false;zoom=Math.max(.25,Math.min(4,z));rerenderAll();sizeEditor();
  v.scrollTop=ratio*v.scrollHeight-v.clientHeight/2;
}
$('#zinBtn').onclick=()=>setZoom(Math.round((zoom*1.2)*20)/20);
$('#zoutBtn').onclick=()=>setZoom(Math.round((zoom/1.2)*20)/20);
$('#zoomVal').onclick=()=>{fitMode=true;computeFit();rerenderAll();sizeEditor();};
$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;
let rsT;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(fitMode){const z=zoom;computeFit();if(Math.abs(z-zoom)>.01)rerenderAll();}},150);});

/* ---------- export ---------- */
function hex(c){const n=parseInt(c.slice(1),16);return PDFLib.rgb(((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255);}
async function buildPdf(){
  const{PDFDocument,degrees,BlendMode,LineCapStyle}=PDFLib;
  const out=await PDFDocument.create();
  let copied=[];
  if(srcBytes){
    const src=await PDFDocument.load(srcBytes,{ignoreEncryption:true,updateMetadata:false});
    const idx=pages.filter(p=>p.src!=null).map(p=>p.src);
    if(idx.length)copied=await out.copyPages(src,idx);
    try{const t=src.getTitle();if(t)out.setTitle(t);}catch(_){}
  }
  if(window.fontkit)out.registerFontkit(window.fontkit);
  out.setProducer('PDF Bench');out.setModificationDate(new Date());
  const fontCache={};
  
  const imgCache={};
  let ci=0;
  for(const p of pages){
    let pg;
    if(p.src!=null)pg=out.addPage(copied[ci++]);else pg=out.addPage([p.view[2]-p.view[0],p.view[3]-p.view[1]]);
    const R=rotOf(p);pg.setRotation(degrees(R));
    const rot=degrees(R);
    const P=(x,y)=>toPdf(p,x,y);
    const pathOf=pts=>pts.map(([x,y],k)=>{const[a,b]=P(x,y);return(k?'L':'M')+a.toFixed(2)+' '+(-b).toFixed(2);}).join(' ');
    for(const o of p.objs){
      if(o.type==='whiteout'||o.type==='highlight'){
        const[x,y]=P(o.x,o.y+o.h);
        pg.drawRectangle({x,y,width:o.w,height:o.h,rotate:rot,color:hex(o.color),opacity:o.type==='highlight'?o.opacity:1,blendMode:o.type==='highlight'?BlendMode.Multiply:undefined});
      }else if(o.type==='rect'){
        const s=o.stroke?o.sw:0;const[x,y]=P(o.x+s/2,o.y+o.h-s/2);
        pg.drawRectangle({x,y,width:Math.max(0,o.w-s),height:Math.max(0,o.h-s),rotate:rot,color:o.fill?hex(o.fill):undefined,opacity:o.opacity,borderColor:o.stroke?hex(o.stroke):undefined,borderWidth:s,borderOpacity:o.opacity});
      }else if(o.type==='ellipse'){
        const s=o.stroke?o.sw:0;const cx=o.x+o.w/2,cy=o.y+o.h/2,rx=Math.max(.1,o.w/2-s/2),ry=Math.max(.1,o.h/2-s/2);const pts=[];
        for(let k=0;k<=72;k++){const a=k/72*Math.PI*2;pts.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)]);}
        pg.drawSvgPath(pathOf(pts)+' Z',{x:0,y:0,color:o.fill?hex(o.fill):undefined,opacity:o.opacity,borderColor:o.stroke?hex(o.stroke):undefined,borderWidth:s,borderOpacity:o.opacity});
      }else if(o.type==='draw'){
        const pts=o.pts.map(([u,v])=>[o.x+u*o.w,o.y+v*o.h]);
        pg.drawSvgPath(pathOf(pts),{x:0,y:0,borderColor:hex(o.stroke),borderWidth:o.sw,borderOpacity:o.opacity,borderLineCap:LineCapStyle.Round});
      }else if(o.type==='mark'){
        for(const q of markPrims(o.kind)){
          const d=pathOf(q.pts.map(([u,v])=>[o.x+u*o.w,o.y+v*o.h]))+(q.closed?' Z':'');
          if(q.fill)pg.drawSvgPath(d,{x:0,y:0,color:hex(o.color),opacity:o.opacity??1});
          else pg.drawSvgPath(d,{x:0,y:0,borderColor:hex(o.color),borderWidth:q.sw*Math.min(o.w,o.h),borderOpacity:o.opacity??1,borderLineCap:LineCapStyle.Round});
        }
      }else if(o.type==='image'){
        const im=images[o.img];if(!im)continue;
        const e=imgCache[o.img]||(imgCache[o.img]=im.kind==='jpg'?await out.embedJpg(im.bytes):await out.embedPng(im.bytes));
        const[x,y]=P(o.x,o.y+o.h);pg.drawImage(e,{x,y,width:o.w,height:o.h,rotate:rot,opacity:o.opacity??1});
      }else if(o.type==='text'){
        if(!o.text.trim())continue;
        const m=measure(o);const v=vKey(o);let f=null;
        let vector=hasGlyphs(o.font,v,o.text);
        if(vector){const ck='u'+o.font+v;try{f=fontCache[ck]||(fontCache[ck]=await out.embedFont(FONTBYTES[o.font][v],{subset:true}));}catch(err){console.error(err);vector=false;}}
        if(vector){
          m.lines.forEach((l,i)=>{if(!l)return;const[x,y]=P(o.x,o.y+m.base+i*m.lh);pg.drawText(l,{x,y,size:o.size,font:f,color:hex(o.color),rotate:rot,opacity:o.opacity??1});});
        }else{
          const k=5,pad=o.size*.3;const c=document.createElement('canvas');c.width=Math.ceil((m.w+pad*2)*k);c.height=Math.ceil((m.h+pad*2)*k);
          const ctx=c.getContext('2d');ctx.scale(k,k);ctx.font=cssFont(o,o.size);ctx.fillStyle=o.color;ctx.textBaseline='alphabetic';
          m.lines.forEach((l,i)=>ctx.fillText(l,pad,pad+m.base+i*m.lh));
          const bytes=Uint8Array.from(atob(c.toDataURL('image/png').split(',')[1]),ch=>ch.charCodeAt(0));
          const e=await out.embedPng(bytes);const W=c.width/k,H=c.height/k;
          const[x,y]=P(o.x-pad,o.y-pad+H);pg.drawImage(e,{x,y,width:W,height:H,rotate:rot,opacity:o.opacity??1});
        }
      }
    }
  }
  return out.save();
}
let dl=null,dlTried=false;
async function getDownloads(){if(dlTried)return dl;dlTried=true;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(_){dl=null;}return dl;}
async function savePdf(){
  if(editing)finishEdit();
  if(!window.PDFLib){say(tr('writeFail'),true);return;}
  busy(true,tr('building'));let bytes;
  try{bytes=await buildPdf();}catch(e){console.error(e);busy(false);say(tr('buildFail',e.message||e),true);return;}
  busy(false);
  const name=(fileName||'document.pdf').replace(/\.pdf$/i,'')+'-edited.pdf';
  await offerFile(name,new Blob([bytes],{type:'application/pdf'}));
}
$('#saveBtn').onclick=savePdf;
